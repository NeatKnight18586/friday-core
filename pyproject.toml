[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: exercises multiple repository components together",
  "security: checks defensive behavior and privacy boundaries",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["local-workspace", "dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
